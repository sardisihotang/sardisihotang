<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400" role="img" aria-label="">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050d1f"/>
      <stop offset="0.55" stop-color="#0a1f45"/>
      <stop offset="1" stop-color="#0d3a6e"/>
    </linearGradient>
    <radialGradient id="glowR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#08142b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c2447"/>
      <stop offset="1" stop-color="#071531"/>
    </linearGradient>
    <linearGradient id="barG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#38bdf8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="s1"><rect x="712" y="112" width="336" height="146" rx="6"/></clipPath>
    <clipPath id="s2"><rect x="1112" y="152" width="276" height="106" rx="6"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect width="1600" height="400" fill="url(#grid)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="8s" repeatCount="indefinite"/>
  </rect>
  <ellipse cx="880" cy="190" rx="520" ry="200" fill="url(#glowR)"/>
  <ellipse cx="520" cy="200" rx="200" ry="170" fill="url(#glowR)" opacity="0.6"/>

  <!-- Flowing data lines -->
  <g fill="none" stroke="#22d3ee" stroke-width="1.4" stroke-linecap="round" opacity="0.55">
    <path d="M0 70 C 200 30, 380 110, 600 60 S 1000 20, 1250 55 S 1500 90, 1600 40" stroke-dasharray="6 14">
      <animate attributeName="stroke-dashoffset" from="0" to="-200" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M0 360 C 260 380, 480 340, 760 372 S 1200 350, 1600 375" stroke-dasharray="3 12" opacity="0.7">
      <animate attributeName="stroke-dashoffset" from="0" to="150" dur="12s" repeatCount="indefinite"/>
    </path>
    <path d="M590 215 C 640 215, 660 190, 712 190" stroke-dasharray="4 8" stroke-width="1.6">
      <animate attributeName="stroke-dashoffset" from="0" to="-96" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M1048 200 C 1075 200, 1085 205, 1112 205" stroke-dasharray="4 8" stroke-width="1.6">
      <animate attributeName="stroke-dashoffset" from="0" to="-96" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Drifting particles -->
  <g fill="#67e8f9">
    <circle cx="90" cy="300" r="2"><animate attributeName="cy" values="300;60;300" dur="22s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.1;0.7;0.1" dur="22s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="120" r="1.5"><animate attributeName="cy" values="120;330;120" dur="26s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0.1;0.5" dur="26s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="250" r="2.2"><animate attributeName="cy" values="250;40;250" dur="30s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;0.8;0.2" dur="30s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="60" r="1.6"><animate attributeName="cy" values="60;280;60" dur="24s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0.1;0.6" dur="24s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="320" r="1.8"><animate attributeName="cy" values="320;70;320" dur="28s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.1;0.7;0.1" dur="28s" repeatCount="indefinite"/></circle>
    <circle cx="790" cy="50" r="2"><animate attributeName="cy" values="50;300;50" dur="25s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0.1;0.6" dur="25s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="310" r="1.5"><animate attributeName="cy" values="310;60;310" dur="21s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.1;0.6;0.1" dur="21s" repeatCount="indefinite"/></circle>
    <circle cx="1090" cy="80" r="2.2"><animate attributeName="cy" values="80;300;80" dur="27s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0.1;0.5" dur="27s" repeatCount="indefinite"/></circle>
    <circle cx="1220" cy="300" r="1.6"><animate attributeName="cy" values="300;50;300" dur="23s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.1;0.7;0.1" dur="23s" repeatCount="indefinite"/></circle>
    <circle cx="1330" cy="90" r="2"><animate attributeName="cy" values="90;310;90" dur="29s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0.1;0.6" dur="29s" repeatCount="indefinite"/></circle>
    <circle cx="1450" cy="280" r="1.8"><animate attributeName="cy" values="280;40;280" dur="20s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.1;0.7;0.1" dur="20s" repeatCount="indefinite"/></circle>
    <circle cx="1540" cy="110" r="1.5"><animate attributeName="cy" values="110;320;110" dur="31s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0.1;0.5" dur="31s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ===== Monitor 1 ===== -->
  <g>
    <rect x="860" y="268" width="40" height="40" fill="url(#silver)"/>
    <rect x="830" y="304" width="100" height="10" rx="5" fill="url(#silver)"/>
    <rect x="700" y="100" width="360" height="170" rx="14" fill="#13294b" stroke="#8fb4d6" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="712" y="112" width="336" height="146" rx="6" fill="url(#screen)"/>
    <g clip-path="url(#s1)">
      <!-- window dots -->
      <circle cx="728" cy="124" r="3" fill="#22d3ee" opacity="0.8"/>
      <circle cx="740" cy="124" r="3" fill="#94a3b8" opacity="0.6"/>
      <circle cx="752" cy="124" r="3" fill="#94a3b8" opacity="0.4"/>
      <line x1="712" y1="136" x2="1048" y2="136" stroke="#38bdf8" stroke-opacity="0.2"/>
      <!-- baseline + guides -->
      <line x1="724" y1="246" x2="884" y2="246" stroke="#38bdf8" stroke-opacity="0.35"/>
      <line x1="724" y1="214" x2="884" y2="214" stroke="#38bdf8" stroke-opacity="0.1"/>
      <line x1="724" y1="182" x2="884" y2="182" stroke="#38bdf8" stroke-opacity="0.1"/>
      <line x1="724" y1="150" x2="884" y2="150" stroke="#38bdf8" stroke-opacity="0.1"/>
      <!-- animated bars -->
      <rect x="734" y="206" width="16" height="40" rx="2" fill="url(#barG)"><animate attributeName="y" values="206;176;206" dur="5s" repeatCount="indefinite"/><animate attributeName="height" values="40;70;40" dur="5s" repeatCount="indefinite"/></rect>
      <rect x="760" y="190" width="16" height="56" rx="2" fill="url(#barG)"><animate attributeName="y" values="190;212;190" dur="6s" repeatCount="indefinite"/><animate attributeName="height" values="56;34;56" dur="6s" repeatCount="indefinite"/></rect>
      <rect x="786" y="170" width="16" height="76" rx="2" fill="url(#barG)"><animate attributeName="y" values="170;152;170" dur="7s" repeatCount="indefinite"/><animate attributeName="height" values="76;94;76" dur="7s" repeatCount="indefinite"/></rect>
      <rect x="812" y="196" width="16" height="50" rx="2" fill="url(#barG)"><animate attributeName="y" values="196;170;196" dur="5.5s" repeatCount="indefinite"/><animate attributeName="height" values="50;76;50" dur="5.5s" repeatCount="indefinite"/></rect>
      <rect x="838" y="160" width="16" height="86" rx="2" fill="url(#barG)"><animate attributeName="y" values="160;184;160" dur="6.5s" repeatCount="indefinite"/><animate attributeName="height" values="86;62;86" dur="6.5s" repeatCount="indefinite"/></rect>
      <rect x="864" y="180" width="16" height="66" rx="2" fill="url(#barG)"><animate attributeName="y" values="180;158;180" dur="4.5s" repeatCount="indefinite"/><animate attributeName="height" values="66;88;66" dur="4.5s" repeatCount="indefinite"/></rect>
      <!-- line chart -->
      <line x1="904" y1="246" x2="1036" y2="246" stroke="#38bdf8" stroke-opacity="0.35"/>
      <path d="M904 226 L926 208 L948 218 L970 180 L992 192 L1014 156 L1036 166" fill="none" stroke="#e0f2fe" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="220" stroke-dashoffset="220">
        <animate attributeName="stroke-dashoffset" values="220;0;0;220" keyTimes="0;0.5;0.85;1" dur="8s" repeatCount="indefinite"/>
      </path>
      <path d="M904 238 L926 232 L948 226 L970 214 L992 210 L1014 196 L1036 190" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.8" stroke-dasharray="200" stroke-dashoffset="200">
        <animate attributeName="stroke-dashoffset" values="200;0;0;200" keyTimes="0;0.55;0.9;1" dur="8s" begin="0.6s" repeatCount="indefinite"/>
      </path>
      <circle cx="1036" cy="166" r="3.5" fill="#e0f2fe"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.5;0.85;1" dur="8s" repeatCount="indefinite"/></circle>
      <!-- scanline flicker -->
      <rect x="712" y="112" width="336" height="146" fill="#67e8f9" opacity="0">
        <animate attributeName="opacity" values="0;0.04;0;0;0.025;0" keyTimes="0;0.1;0.2;0.6;0.7;1" dur="4s" repeatCount="indefinite"/>
      </rect>
      <rect x="712" y="100" width="336" height="10" fill="#67e8f9" opacity="0.07">
        <animate attributeName="y" values="112;258;112" dur="6s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- ===== Monitor 2 ===== -->
  <g>
    <rect x="1236" y="272" width="30" height="34" fill="url(#silver)"/>
    <rect x="1210" y="304" width="82" height="10" rx="5" fill="url(#silver)"/>
    <rect x="1100" y="140" width="300" height="132" rx="12" fill="#13294b" stroke="#8fb4d6" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="1112" y="152" width="276" height="106" rx="6" fill="url(#screen)"/>
    <g clip-path="url(#s2)">
      <!-- code lines -->
      <g fill="#67e8f9">
        <rect x="1126" y="168" width="70" height="5" rx="2.5" opacity="0.8"><animate attributeName="opacity" values="0.8;0.4;0.8" dur="3s" repeatCount="indefinite"/></rect>
        <rect x="1140" y="182" width="104" height="5" rx="2.5" fill="#e0f2fe" opacity="0.55"/>
        <rect x="1140" y="196" width="56" height="5" rx="2.5" opacity="0.6"><animate attributeName="opacity" values="0.6;0.9;0.6" dur="4s" repeatCount="indefinite"/></rect>
        <rect x="1204" y="196" width="40" height="5" rx="2.5" fill="#94a3b8" opacity="0.6"/>
        <rect x="1154" y="210" width="88" height="5" rx="2.5" fill="#e0f2fe" opacity="0.5"/>
        <rect x="1140" y="224" width="64" height="5" rx="2.5" opacity="0.55"><animate attributeName="opacity" values="0.55;0.25;0.55" dur="3.5s" repeatCount="indefinite"/></rect>
        <rect x="1126" y="238" width="46" height="5" rx="2.5" opacity="0.8"/>
        <rect x="1180" y="238" width="3" height="5" fill="#e0f2fe"><animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/></rect>
      </g>
      <!-- donut -->
      <circle cx="1336" cy="204" r="26" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="7"/>
      <circle cx="1336" cy="204" r="26" fill="none" stroke="#22d3ee" stroke-width="7" stroke-linecap="round" stroke-dasharray="100 163.4" transform="rotate(-90 1336 204)">
        <animate attributeName="stroke-dasharray" values="60 163.4;110 163.4;60 163.4" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1336" cy="204" r="12" fill="#22d3ee" opacity="0.12"><animate attributeName="opacity" values="0.08;0.22;0.08" dur="3s" repeatCount="indefinite"/></circle>
      <!-- sparkline -->
      <path d="M1296 246 L1310 240 L1322 243 L1336 234 L1350 238 L1364 230 L1376 233" fill="none" stroke="#e0f2fe" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="100" stroke-dashoffset="100">
        <animate attributeName="stroke-dashoffset" values="100;0;0;100" keyTimes="0;0.5;0.85;1" dur="6s" repeatCount="indefinite"/>
      </path>
      <rect x="1112" y="152" width="276" height="106" fill="#67e8f9" opacity="0">
        <animate attributeName="opacity" values="0;0;0.035;0;0" keyTimes="0;0.3;0.35;0.4;1" dur="5s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- ===== Desk ===== -->
  <rect x="0" y="314" width="1600" height="16" fill="url(#desk)"/>
  <rect x="0" y="314" width="1600" height="2" fill="#38bdf8" opacity="0.5"/>
  <rect x="0" y="330" width="1600" height="70" fill="#050d1f" opacity="0.85"/>
  <rect x="640" y="305" width="150" height="9" rx="4.5" fill="url(#silver)" opacity="0.9"/>
  <rect x="1330" y="296" width="8" height="18" rx="2" fill="url(#silver)"/>
  <ellipse cx="860" cy="316" rx="420" ry="10" fill="#22d3ee" opacity="0.12" filter="url(#soft)"/>

  <!-- ===== Robot ===== -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="5s" repeatCount="indefinite"/>
    <!-- torso -->
    <path d="M462 214 Q462 196 482 196 L568 196 Q588 196 588 214 L596 314 L454 314 Z" fill="url(#body)"/>
    <path d="M470 250 L580 250" stroke="#94a3b8" stroke-opacity="0.6" stroke-width="1.5"/>
    <!-- chest light -->
    <circle cx="540" cy="226" r="9" fill="#0b1d3a"/>
    <circle cx="540" cy="226" r="5" fill="#22d3ee"><animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="226" r="14" fill="none" stroke="#22d3ee" stroke-opacity="0.35"><animate attributeName="r" values="12;18;12" dur="3s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.5;0;0.5" dur="3s" repeatCount="indefinite"/></circle>
    <!-- shoulders -->
    <circle cx="470" cy="214" r="16" fill="url(#silver)"/>
    <circle cx="580" cy="214" r="16" fill="url(#silver)"/>
    <!-- arm toward desk -->
    <path d="M582 220 Q618 240 634 292" fill="none" stroke="url(#silver)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="636" cy="298" r="9" fill="url(#body)"/>
    <!-- neck -->
    <rect x="515" y="180" width="30" height="20" rx="6" fill="url(#silver)"/>
    <!-- head -->
    <rect x="474" y="100" width="116" height="84" rx="36" fill="url(#body)"/>
    <rect x="486" y="116" width="98" height="46" rx="23" fill="#07182e"/>
    <rect x="486" y="116" width="98" height="46" rx="23" fill="none" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="1.2"/>
    <!-- eyes -->
    <ellipse cx="520" cy="139" rx="8" ry="8" fill="#67e8f9">
      <animate attributeName="ry" values="8;8;8;0.8;8;8" keyTimes="0;0.86;0.9;0.93;0.96;1" dur="5s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="552" cy="139" rx="8" ry="8" fill="#67e8f9">
      <animate attributeName="ry" values="8;8;8;0.8;8;8" keyTimes="0;0.86;0.9;0.93;0.96;1" dur="5s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="536" cy="139" rx="40" ry="14" fill="#22d3ee" opacity="0.12" filter="url(#soft)"/>
    <!-- ear + antenna -->
    <rect x="466" y="126" width="10" height="26" rx="5" fill="url(#silver)"/>
    <rect x="588" y="126" width="10" height="26" rx="5" fill="url(#silver)"/>
    <line x1="532" y1="100" x2="532" y2="84" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="532" cy="80" r="4" fill="#22d3ee"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- subtle vignette -->
  <rect width="1600" height="400" fill="none" stroke="#050d1f" stroke-opacity="0.5" stroke-width="2"/>

  
  <!-- ===== Animated Header Text Overlay ===== -->
  <!-- Name and typing animation, positioned above the monitors -->

  <g font-family="Arial, Helvetica, sans-serif"
     text-anchor="middle">

    <!-- Name -->
    <text x="1050" y="44"
          font-size="31"
          font-weight="700"
          fill="#f8fafc">
      Hi, I'm Sardianto Sihotang 👋
    </text>

    <!-- Typing reveal mask -->
    <defs>
      <clipPath id="typingMask">
        <rect x="725" y="54" width="0" height="35">
          <animate
            attributeName="width"
            values="0;650;650;0"
            keyTimes="0;0.72;0.90;1"
            dur="4s"
            repeatCount="indefinite"/>
        </rect>
      </clipPath>
    </defs>

    <!-- Animated typing lines -->
    <g clip-path="url(#typingMask)"
       fill="#38BDF8"
       font-size="20"
       font-weight="600">

      <text x="1050" y="77" opacity="0">
        Data Analyst | Web Developer
        <animate attributeName="opacity"
                 values="1;1;0;0;0"
                 keyTimes="0;0.249;0.25;0.999;1"
                 dur="16s"
                 repeatCount="indefinite"/>
      </text>

      <text x="1050" y="77" opacity="0">
        Information Systems Graduate
        <animate attributeName="opacity"
                 values="0;0;1;1;0;0"
                 keyTimes="0;0.249;0.25;0.499;0.5;1"
                 dur="16s"
                 repeatCount="indefinite"/>
      </text>

      <text x="1050" y="77" opacity="0">
        Data | AI | Machine Learning
        <animate attributeName="opacity"
                 values="0;0;1;1;0;0"
                 keyTimes="0;0.499;0.5;0.749;0.75;1"
                 dur="16s"
                 repeatCount="indefinite"/>
      </text>

      <text x="1050" y="77" opacity="0">
        Turning Data Into Meaningful Insights
        <animate attributeName="opacity"
                 values="0;0;1;1;0"
                 keyTimes="0;0.749;0.75;0.999;1"
                 dur="16s"
                 repeatCount="indefinite"/>
      </text>
    </g>
  </g>
</svg>
